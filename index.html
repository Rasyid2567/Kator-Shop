<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kastor Shop</title>
  <link rel="shortcut icon" href="logo.png" type="image/x-icon">
  <script src="http://cdn.tailwindcss.com"></script>
  <style>
    #sidebarOverlay {
      display: none;
    }

    @media (max-width: 767px) {
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100dvh;
        z-index: 40;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        width: 14rem;
      }

      #sidebar.open {
        transform: translateX(0);
      }

      #sidebarOverlay.open {
        display: block;
      }
    }
  </style>
</head>

<body class="bg-gray-100 text-gray-900 font-sans">
  <header
    class="md:hidden sticky top-0 z-30 flex items-center justify-between bg-white border-b-2 border-blue-900 px-4 py-2.5">
    <button id="hamburgerBtn" class="text-blue-900 focus:outline-none" aria-label="Menu">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <span class="font-bold text-blue-900 text-sm flex items-center gap-2">
      <img src="logo.png" alt="Logo" class="w-6 h-6 object-contain" />
      <span>Kastor Shop</span>
    </span>
    <div class="w-6"></div>
  </header>

  <sidebar-overlay id="sidebarOverlay" class="fixed inset-0 bg-black/40 z-30"></sidebar-overlay>

  <main class="flex min-h-screen">
    <nav id="sidebar" class="w-56 bg-gray-100 border-r-2 border-blue-900 p-4 shrink-0">
      <div
        class="font-bold text-blue-900 mb-4 text-base flex md:hidden items-center justify-center border-b border-blue-200 pb-2.5">
        <span>Menu</span>
      </div>

      <div class="font-bold text-blue-900 mb-4 text-sm hidden md:flex items-center justify-center gap-2">
        <img src="logo.png" alt="Logo" class="w-6 h-6 object-contain" />
        <span>Kastor Shop</span>
      </div>

      <nav-customer
        class="nav-item customer-only block text-center bg-white border border-blue-900 text-gray-800 py-2.5 px-2 mb-2.5 rounded-full text-[13px] tracking-wide cursor-pointer select-none hover:bg-blue-50"
        data-section="belanja">
        BELANJA
      </nav-customer>
      <nav-customer
        class="nav-item customer-only block text-center bg-white border border-blue-900 text-gray-800 py-2.5 px-2 mb-2.5 rounded-full text-[13px] tracking-wide cursor-pointer select-none hover:bg-blue-50"
        data-section="keranjang">
        KERANJANG
      </nav-customer>
      <nav-customer
        class="nav-item customer-only block text-center bg-white border border-blue-900 text-gray-800 py-2.5 px-2 mb-2.5 rounded-full text-[13px] tracking-wide cursor-pointer select-none hover:bg-blue-50"
        data-section="riwayat">
        RIWAYAT TRANSAKSI
      </nav-customer>
      <nav-customer id="logoutBtn"
        class="block text-center bg-white border border-red-700 text-red-700 py-2.5 px-2 mt-7 rounded-full text-[13px] tracking-wide cursor-pointer select-none hover:bg-red-50">
        LOGOUT
      </nav-customer>
    </nav>

    <div class="flex-1 p-4 md:p-6 min-w-0">
      <div class="flex justify-between items-center mb-2.5">
        <div class="text-xs text-gray-600">
          Selamat Datang <b id="currentUser"></b>
        </div>
      </div>

      <section class="customer-only" id="section-belanja">
        <h1 class="text-lg md:text-xl text-blue-900 font-semibold mb-4 border-b-2 border-blue-900 pb-2">Belanja Produk
        </h1>
        <div
          class="grid gap-3 md:gap-4 grid-cols-2 sm:grid-cols-3 lg:[grid-template-columns:repeat(auto-fill,minmax(190px,1fr))]"
          id="productGrid"></div>
      </section>

      <section class="customer-only hidden" id="section-keranjang">
        <h1 class="text-lg md:text-xl text-blue-900 font-semibold mb-4 border-b-2 border-blue-900 pb-2">Keranjang Saya
        </h1>
        <div class="bg-white border border-blue-100 rounded-md overflow-hidden p-3 md:p-4">
          <div id="cartCards" class="space-y-3 mb-4"></div>
          <div class="flex flex-col sm:flex-row justify-between items-center gap-2 border-t border-blue-100 pt-3.5">
            <div class="text-[15px]">Total: <b id="cartTotal">Rp 0</b></div>
            <button id="checkoutBtn"
              class="w-full sm:w-auto bg-blue-900 text-white border-none py-2 px-5 rounded text-[13px] cursor-pointer hover:bg-blue-950">
              Checkout
            </button>
          </div>
        </div>
      </section>

      <section class="customer-only hidden" id="section-riwayat">
        <h1 class="text-lg md:text-xl text-blue-900 font-semibold mb-4 border-b-2 border-blue-900 pb-2">Riwayat
          Transaksi Saya</h1>
        <div id="riwayatCards" class="space-y-3"></div>
      </section>
    </div>
  </main>

  <div id="popupOverlay"
    class="fixed inset-0 bg-black/50 backdrop-blur-sm z-[9999] hidden items-center justify-center transition-opacity duration-200 opacity-0"
    style="display:none;">
    <div id="popupBox"
      class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-[90%] transform scale-90 translate-y-3 opacity-0 transition-all duration-200 ease-out">
      <div class="flex items-center gap-3 mb-3">
        <div id="popupIcon"
          class="w-10 h-10 rounded-full flex items-center justify-center text-white text-xl font-bold shrink-0"></div>
        <h3 id="popupTitle" class="text-base font-semibold text-gray-800"></h3>
      </div>
      <p id="popupMessage" class="text-sm text-gray-600 mb-5 leading-relaxed"></p>
      <div id="popupActions" class="flex gap-2 justify-end"></div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/popup.js"></script>
  <script src="js/app.js"></script>

  <script>
    (function () {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const hamburger = document.getElementById('hamburgerBtn');

      function openSidebar() {
        sidebar.classList.add('open');
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
      function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.classList.remove('open');
        document.body.style.overflow = '';
      }

      if (hamburger) {
        hamburger.addEventListener('click', () => {
          sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
        });
      }
      const closeBtn = document.getElementById('closeSidebarBtn');
      if (closeBtn) {
        closeBtn.addEventListener('click', closeSidebar);
      }
      if (overlay) {
        overlay.addEventListener('click', closeSidebar);
      }

      document.querySelectorAll('.nav-item[data-section]').forEach(item => {
        item.addEventListener('click', () => {
          if (window.innerWidth < 768) closeSidebar();
        });
      });

      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          if (window.innerWidth < 768) closeSidebar();
        });
      }
    })();
  </script>
</body>

</html>
