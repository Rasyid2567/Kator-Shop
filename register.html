<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Kastor Shop</title>
  <link rel="shortcut icon" href="logo.png" type="image/x-icon">
  <script src="http://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4 font-sans">
  <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg border border-blue-100 max-w-sm w-full">
    <div class="flex flex-col items-center mb-6 text-center">
      <img src="logo.png" alt="Logo" class="w-12 h-12 object-contain mb-2" onerror="this.src='https://placehold.co/48x48?text=Kastor'" />
      <h1 class="text-xl font-bold text-blue-900">Kastor Shop</h1>
      <p class="text-xs text-gray-500 mt-1">Buat akun baru untuk mulai belanja</p>
    </div>

    <div id="errorBox" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-md"></div>
    <div id="successBox" class="hidden mb-4 p-3 bg-green-50 border border-green-200 text-green-700 text-xs rounded-md"></div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="mb-3">
        <label class="block text-xs font-semibold text-gray-700 mb-1">Username</label>
        <input type="text" id="username" required placeholder="Pilih username"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-900" />
      </div>

      <div class="mb-3">
        <label class="block text-xs font-semibold text-gray-700 mb-1">Email</label>
        <input type="email" id="email" required placeholder="contoh@email.com"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-900" />
      </div>

      <div class="mb-3">
        <label class="block text-xs font-semibold text-gray-700 mb-1">Nomor HP / WhatsApp</label>
        <input type="tel" id="nohp" required placeholder="081234567890" pattern="[0-9]{9,15}" title="Masukkan nomor HP yang valid (9-15 digit)"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-900" />
      </div>

      <div class="mb-4">
        <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
        <div class="relative">
          <input type="password" id="password" required placeholder="Buat password"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 pr-10" />
          <button type="button" onclick="togglePasswordVisibility('password', this)"
            class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 p-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 6.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
      </div>

      <div class="mb-5">
        <label class="block text-xs font-semibold text-gray-700 mb-1">Konfirmasi Password</label>
        <div class="relative">
          <input type="password" id="confirmPassword" required placeholder="Ulangi password"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-900 pr-10" />
          <button type="button" onclick="togglePasswordVisibility('confirmPassword', this)"
            class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 p-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 6.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit"
        class="w-full bg-blue-900 text-white font-semibold py-2.5 rounded-lg text-sm hover:bg-blue-950 transition-colors shadow">
        Daftar
      </button>
    </form>

    <div class="mt-5 text-center text-xs text-gray-600">
      Sudah punya akun?
      <a href="/login" class="text-blue-900 font-semibold hover:underline">Masuk</a>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
