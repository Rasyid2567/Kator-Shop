<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kator Shop | Register</title>
  <link rel="shortcut icon" href="/logo.png" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-900 font-sans">
  <main class="min-h-screen flex items-center justify-center">
    <section class="bg-white border border-blue-900 rounded-md p-8 w-80 shadow-md">
      <h2 class="text-center text-blue-900 text-xl font-bold mb-5">Daftar Akun</h2>
      <form id="registerForm">
        <label for="username" class="block text-xs text-gray-700 mt-2.5 mb-1">Username</label>
        <input type="text" id="username" required autocomplete="username"
          class="w-full py-2 px-2.5 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-900" />

        <label for="password" class="block text-xs text-gray-700 mt-2.5 mb-1">Password</label>
        <div class="relative">
          <input type="password" id="password" required autocomplete="new-password"
            class="w-full py-2 pl-2.5 pr-9 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-900" />
          <button type="button" onclick="togglePasswordVisibility('password', this)"
            class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-500 hover:text-blue-900 focus:outline-none p-1"
            aria-label="Tampilkan password">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 6.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>

        <label for="confirmPassword" class="block text-xs text-gray-700 mt-2.5 mb-1">Konfirmasi Password</label>
        <div class="relative">
          <input type="password" id="confirmPassword" required autocomplete="new-password"
            class="w-full py-2 pl-2.5 pr-9 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-900" />
          <button type="button" onclick="togglePasswordVisibility('confirmPassword', this)"
            class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-500 hover:text-blue-900 focus:outline-none p-1"
            aria-label="Tampilkan password">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 6.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>

        <button type="submit"
          class="w-full mt-4 py-2 bg-blue-900 text-white rounded text-sm cursor-pointer hover:bg-blue-950">
          Daftar
        </button>
        <div id="errorBox"
          class="hidden bg-red-100 text-red-800 border border-red-300 py-1.5 px-2.5 rounded text-xs mt-2.5"></div>
        <div id="successBox"
          class="hidden bg-green-100 text-green-800 border border-green-300 py-1.5 px-2.5 rounded text-xs mt-2.5"></div>
      </form>
      <login class="text-center text-xs mt-3.5">
        Sudah punya akun?
        <a href="/login" class="text-blue-900 hover:underline">Login di sini</a>
      </login>
    </section>
  </main>

  <script src="/js/storage.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", handleRegister);
  </script>
</body>

</html>
