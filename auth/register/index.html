<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kator Shop | Register</title>
  <link rel="shortcut icon" href="/logo.png" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-900 font-sans">
  <main class="min-h-screen flex items-center justify-center">
    <section class="bg-white border border-blue-900 rounded-md p-8 w-80 shadow-md">
      <h2 class="text-center text-blue-900 text-xl font-bold mb-5">Daftar Akun</h2>
      <form id="registerForm">
        <label for="username" class="block text-xs text-gray-700 mt-2.5 mb-1">Username</label>
        <input type="text" id="username" required autocomplete="username"
          class="w-full py-2 px-2.5 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-900" />

        <label for="password" class="block text-xs text-gray-700 mt-2.5 mb-1">Password</label>
        <input type="password" id="password" required autocomplete="new-password"
          class="w-full py-2 px-2.5 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-900" />

        <label for="confirmPassword" class="block text-xs text-gray-700 mt-2.5 mb-1">Konfirmasi Password</label>
        <input type="password" id="confirmPassword" required autocomplete="new-password"
          class="w-full py-2 px-2.5 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-900" />

        <button type="submit"
          class="w-full mt-4 py-2 bg-blue-900 text-white rounded text-sm cursor-pointer hover:bg-blue-950">
          Daftar
        </button>
        <div id="errorBox"
          class="hidden bg-red-100 text-red-800 border border-red-300 py-1.5 px-2.5 rounded text-xs mt-2.5"></div>
        <div id="successBox"
          class="hidden bg-green-100 text-green-800 border border-green-300 py-1.5 px-2.5 rounded text-xs mt-2.5"></div>
      </form>
      <login class="text-center text-xs mt-3.5">
        Sudah punya akun?
        <a href="/login" class="text-blue-900 hover:underline">Login di sini</a>
      </login>
    </section>
  </main>

  <script src="/js/storage.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", handleRegister);
  </script>
</body>

</html>
